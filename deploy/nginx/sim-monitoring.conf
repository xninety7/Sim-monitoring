# This server block is for sim-monitoring.bewen.me, pointed at this ECS instance.
# Obtain/install the TLS certificate before enabling this server block.

server {
    listen 80;
    listen [::]:80;
    server_name sim-monitoring.bewen.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sim-monitoring.bewen.me;

    ssl_certificate /etc/ssl/certs/sim-monitoring.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/sim-monitoring.privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    # Interim access gate for the current single-team deployment.
    # Create this file with htpasswd before enabling the site.
    auth_basic "SIM Monitoring";
    auth_basic_user_file /etc/nginx/sim-monitoring.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Authenticated-User $remote_user;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
