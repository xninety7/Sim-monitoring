<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIM Monitoring Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <p class="signed-in-as">Signed in as <strong id="currentUserName">…</strong> · <span id="liveStatus" class="live-status offline">Connecting…</span></p>
      <header class="topbar">
        <div class="dashboard-title">
          <h1>SIM & Phone Monitor</h1>
        </div>
        <div class="header-controls">
          <a class="secondary-btn activity-link" href="inventory.html">Device inventory</a>
          <a class="secondary-btn activity-link" href="activity.html">Recent activity</a>
          <a id="adminLink" class="secondary-btn activity-link" href="admin.html" hidden>Admin</a>
          <button id="logoutBtn" class="secondary-btn" type="button">Log out</button>
        </div>
      </header>

      <p id="appMessage" class="app-message" role="status" hidden></p>

      <section class="panel" aria-labelledby="phonesHeading">
        <div class="table-header">
          <h2 id="phonesHeading">Monitored phones</h2>
          <span id="phonesCount">Loading…</span>
        </div>
        <p class="admin-help">Phones appear here automatically once a Mac agent sees them. A ⚠ means a SIM was removed or swapped since it was last accepted.</p>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Phone</th>
                <th>Mac</th>
                <th>Connection</th>
                <th>SIMs</th>
                <th>Asset</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="phonesTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>
    <script src="session.js"></script>
    <script src="phones.js"></script>
  </body>
</html>
